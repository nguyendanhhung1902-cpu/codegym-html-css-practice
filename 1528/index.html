<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch họp công ty</title>
  <style>table{border-collapse:collapse}th,td{border:1px solid #555;padding:10px;text-align:left}th{background:#e7f1f8}</style>
</head>
<body>
  <h1>Lịch họp công ty</h1>
  <table>
    <thead><tr><th scope="col">Ngày</th><th scope="col">Giờ</th><th scope="col">Nội dung cuộc họp</th></tr></thead>
    <tbody>
      <tr><th scope="rowgroup" rowspan="2">Thứ Hai</th><td>09:00–10:00</td><td>Họp khởi động tuần</td></tr>
      <tr><td>11:00–12:00</td><td>Đánh giá tiến độ dự án</td></tr>
      <tr><th scope="row">Thứ Ba</th><td colspan="2">13:00–16:00 — Họp chiến lược kéo dài nhiều giờ</td></tr>
      <tr><th scope="row">Thứ Tư</th><td>10:00–11:00</td><td>Trao đổi với khách hàng</td></tr>
    </tbody>
  </table>
</body>
</html>
