<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng trong CSS</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 24px auto; color: #283548; }
    table { width: 100%; margin: 18px 0 32px; border: 1px solid #36485a; }
    th, td { border: 1px solid #36485a; padding: 12px; }
    th { height: 50px; text-align: left; color: white; background: #2368a0; }
    td { height: 52px; vertical-align: bottom; text-align: right; }
    .collapsed { border-collapse: collapse; }
    .collapsed tr:nth-child(even) { background: #eaf3fa; }
  </style>
</head>
<body>
  <h1>Định kiểu bảng với CSS</h1>
  <h2>Đường viền tách riêng</h2>
  <table><tr><th scope="col">Sản phẩm</th><th scope="col">Giá</th></tr><tr><td>Sách</td><td>90.000 VND</td></tr><tr><td>Bút</td><td>10.000 VND</td></tr></table>
  <h2>Đường viền gộp bằng border-collapse</h2>
  <table class="collapsed"><tr><th scope="col">Sản phẩm</th><th scope="col">Giá</th></tr><tr><td>Sách</td><td>90.000 VND</td></tr><tr><td>Bút</td><td>10.000 VND</td></tr><tr><td>Sổ</td><td>30.000 VND</td></tr></table>
</body>
</html>
