<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký người dùng</title>
  <style>
    body { font-family: Arial, sans-serif; background: #edf5fb; padding: 24px; }
    form { max-width: 440px; margin: 40px auto; background: white; padding: 28px; border: 1px solid #c6d9e8; border-radius: 8px; }
    h1 { margin-top: 0; color: #125d92; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input[type="text"], input[type="email"], input[type="tel"] { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #a6bfd2; border-radius: 4px; font: inherit; }
    fieldset { border: 1px solid #a6bfd2; margin: 18px 0; }
    fieldset label { display: inline-block; margin: 8px 12px 8px 0; font-weight: normal; }
    button { background: #125d92; color: white; border: 0; border-radius: 4px; padding: 10px 18px; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <form action="http://demo.codegym.vn/6/registration_form/register.php" method="post">
    <h1>Đăng ký người dùng</h1>
    <label for="name">Họ và tên</label><input id="name" name="name" type="text" required>
    <label for="email">Email</label><input id="email" name="email" type="email" required>
    <label for="phone">Số điện thoại</label><input id="phone" name="phone" type="tel" required>
    <fieldset><legend>Giới tính</legend>
      <label><input type="radio" name="gender" value="male" required> Nam</label>
      <label><input type="radio" name="gender" value="female"> Nữ</label>
      <label><input type="radio" name="gender" value="other"> Khác</label>
    </fieldset>
    <button type="submit">Đăng ký</button>
  </form>
</body>
</html>
