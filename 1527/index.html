<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách sản phẩm</title>
  <style>table{border-collapse:collapse}th,td{border:1px solid #555;padding:8px 12px;text-align:left}th{background:#e8f0f8}</style>
</head>
<body>
  <h1>Danh sách sản phẩm</h1>
  <table>
    <thead><tr><th scope="col">Tên sản phẩm</th><th scope="col">Giá</th><th scope="col">Số lượng</th></tr></thead>
    <tbody>
      <tr><td>Sổ tay</td><td>25.000 VND</td><td>12</td></tr>
      <tr><td>Bút bi</td><td>8.000 VND</td><td>30</td></tr>
      <tr><td>Thước kẻ</td><td>15.000 VND</td><td>18</td></tr>
      <tr><td>Gôm tẩy</td><td>6.000 VND</td><td>25</td></tr>
    </tbody>
  </table>
</body>
</html>
